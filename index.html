<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/pokeball.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fbf6ea" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b1714" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/home/style.css" />
    <title>My Projects</title>

  <body>
    <main class="home">
      <header>
        <h1>My own projects</h1>
        <p class="tagline">Little things I’ve built. Pick one to try it out.</p>
      </header>

      <!-- One <li> per project. Copy the first one to add another. -->
      <ul class="projects">
        <li>
          <a class="project" href="/scanner/">
            <img src="/mimikyu.png" alt="" />
            <div>
              <h2>Pokémon Scanner</h2>
              <p>Point your camera at a card to find out what it is and what it’s worth.</p>
            </div>
          </a>
        </li>
        <li>
          <a class="project" href="/valorant/">
            <img src="/valorant.svg" alt="" />
            <div>
              <h2>Valorant Tracker</h2>
              <p>Look up any player’s rank, RR history and recent matches, plus the featured store.</p>
            </div>
          </a>
        </li>
      </ul>
    </main>
