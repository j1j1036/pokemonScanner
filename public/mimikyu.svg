<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <g stroke="#3b2f25" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <!-- Zigzag tail poking out from under the costume -->
    <polyline points="48,49 57,46 53,40 60,36 57,30" fill="none" stroke-width="3.5"/>
    <!-- Shadowy body peeking out under the hem -->
    <ellipse cx="32" cy="57" rx="17" ry="4" fill="#3b2f25"/>
    <!-- Upright left ear with a dark tip -->
    <path d="M22 25 L12 4 L29 19 Z" fill="#f7d56b"/>
    <path d="M12 4 L16 12.4 L18.8 10 Z" fill="#3b2f25"/>
    <!-- Floppy right ear, bent over -->
    <path d="M36 20 Q45 9 53 11 Q55 16 45 25 Z" fill="#f7d56b"/>
    <path d="M53 11 Q49 10.5 48 12.5 Q51 15 54 14.5 Z" fill="#3b2f25"/>
    <!-- The costume: round head, bell-shaped body, ragged hem -->
    <path d="M14 57 C11 40 15 19 32 18 C49 19 53 40 50 57 L46 53 L42 57.5 L38 53 L34 57.5 L30 53 L26 57.5 L22 53 L18 57.5 Z" fill="#f7d56b"/>
  </g>
  <!-- Hand-drawn face -->
  <circle cx="25.5" cy="33" r="2.8" fill="#3b2f25"/>
  <circle cx="38.5" cy="33" r="2.8" fill="#3b2f25"/>
  <circle cx="26.4" cy="32" r="0.9" fill="#fff"/>
  <circle cx="39.4" cy="32" r="0.9" fill="#fff"/>
  <ellipse cx="20" cy="39.5" rx="3.4" ry="2.4" fill="#f08a7e" opacity="0.85"/>
  <ellipse cx="44" cy="39.5" rx="3.4" ry="2.4" fill="#f08a7e" opacity="0.85"/>
  <path d="M26 41 Q28 43.5 30 41 Q32 43.5 34 41 Q36 43.5 38 41" fill="none" stroke="#3b2f25" stroke-width="1.6" stroke-linecap="round"/>
</svg>
